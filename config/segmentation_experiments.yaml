# ======================= Segmentation Experiments =======================

# ==========================================================================
#                                  2D Models
# ==========================================================================

unet_2d:
  Mode: "2D"
  Encoder_name: resnet34
  Encoder_weights: imagenet
  Batch: 16
  Epochs: 100
  LR: 0.001
  Pixel_size: 64
  Workers: 4

unet++_2d:
  Mode: "2D"
  Encoder_name: resnet34
  Encoder_weights: imagenet
  Batch: 16
  Epochs: 100
  LR: 0.001
  Pixel_size: 64
  Workers: 4

nnunet_2d:
  Mode: "2D"
  Encoder_name: resnet34  # Ignored by nnUNet (uses self-configuring architecture)
  Encoder_weights: imagenet  # Ignored by nnUNet
  Batch: 16
  Epochs: 100
  LR: 0.001
  Pixel_size: 64
  Workers: 4

deeplabv3+_2d:
  Mode: "2D"
  Encoder_name: resnet34
  Encoder_weights: imagenet
  Batch: 16
  Epochs: 100
  LR: 0.001
  Pixel_size: 64
  Workers: 4

fpn_2d:
  Mode: "2D"
  Encoder_name: resnet34
  Encoder_weights: imagenet
  Batch: 16
  Epochs: 100
  LR: 0.001
  Pixel_size: 64
  Workers: 4

manet_2d:
  Mode: "2D"
  Encoder_name: resnet34
  Encoder_weights: imagenet
  Batch: 16
  Epochs: 100
  LR: 0.001
  Pixel_size: 64
  Workers: 4

linknet_2d:
  Mode: "2D"
  Encoder_name: resnet34
  Encoder_weights: imagenet
  Batch: 16
  Epochs: 100
  LR: 0.001
  Pixel_size: 64
  Workers: 4

pspnet_2d:
  Mode: "2D"
  Encoder_name: resnet34
  Encoder_weights: imagenet
  Batch: 16
  Epochs: 100
  LR: 0.001
  Pixel_size: 64
  Workers: 4

upernet_2d:
  Mode: "2D"
  Encoder_name: resnet34
  Encoder_weights: imagenet
  Batch: 16
  Epochs: 100
  LR: 0.001
  Pixel_size: 64
  Workers: 4

