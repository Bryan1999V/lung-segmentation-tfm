segformer_2d:
  Mode: "2D"
  Encoder_name: resnet34
  Encoder_weights: imagenet
  Batch: 16
  Epochs: 100
  LR: 0.001
  Pixel_size: 64
  Workers: 4

# Only supports resnet50 or resnet101 backbones
fcn_2d:
  Mode: "2D"
  Encoder_name: resnet34
  Encoder_weights: imagenet  # Ignored - uses COCO weights
  Batch: 16
  Epochs: 100
  LR: 0.001
  Pixel_size: 64
  Workers: 4

swin_unetr_2d:
  Mode: "2D"
  Encoder_name: ""  # SwinUNETR doesn't use encoder_name
  Encoder_weights: ""  # SwinUNETR doesn't use encoder_weights
  Batch: 16
  Epochs: 100
  LR: 0.001
  Pixel_size: 224
  Workers: 4

