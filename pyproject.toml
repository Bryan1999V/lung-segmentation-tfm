[project]
name = "lung-segmentation-tfm"
description = "Development of a lung segmentation and classification"
version = "0.1.0"
authors = [{ name = "Bryan1999V", email = "bryanvargasnegrete@gmail.com" }]


[tool.poetry]
readme = "README.md"
package-mode = false


[tool.poetry.dependencies]
python = "^3.10"
matplotlib = "3.10.0"
torch = "2.6.0"


[tool.poetry.group.dev]
optional = true
[tool.poetry.group.dev.dependencies]
ruff = "0.9.6"


[tool.ruff]
extend = "../workspace-config/pyproject.toml"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
