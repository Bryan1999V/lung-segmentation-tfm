[project]
name = "lung-segmentation-tfm"
description = "Development of a lung segmentation and classification"
version = "0.1.0"
authors = [{ name = "Bryan1999V", email = "bryanvargasnegrete@gmail.com" }]


[tool.poetry]
readme = "README.md"
packages = [{ include = "unet" }]


[tool.poetry.dependencies]
python = "^3.10"
matplotlib = "3.10.0"
torch = "2.6.0"
kaggle = "1.7.4.2"
pydicom = "3.0.1"
pynrrd = "1.1.3"
numpy = "2.2.4"
pillow = "11.1.0"
torchvision = "0.21.0"


[tool.poetry.group.dev]
optional = true
[tool.poetry.group.dev.dependencies]
ruff = "0.9.6"


[tool.ruff]
extend = "../workspace-config/pyproject.toml"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
