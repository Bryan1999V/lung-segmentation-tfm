[project]
name = "lung-segmentation-tfm"
dynamic = ["version"]
description = "Development of a lung segmentation and classification"
authors = [{ name = "Bryan1999V", email = "bryanvargasnegrete@gmail.com" }]
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch (==2.4.0)",
    "torchvision (==0.19.0)",
    "torchaudio (==2.4.0)",
    "numpy (==1.23.5)",
    "scipy (==1.8.1)",
    "pandas (==1.5.3)",
    "matplotlib (==3.5.2)",
    "scikit-learn (==1.5.2)",
    "seaborn (==0.11.2)",
    "simpleitk (==2.5.2)",
    "tqdm (==4.64.1)",
    "monai (==1.3.0)",
    "segmentation-models-pytorch (==0.5.0)",
    "segmentation-models-pytorch-3d (==1.0.2)",
    "transformers (==4.57.3)",
    "pylidc (==0.2.3)",
    "setuptools (>=65.5.0)",
    "imageio (>=2.31.1)",
    "hydra-core (>=1.3.2,<2.0.0)",
    "iopath (>=0.1.10)",
    "huggingface-hub (>=0.34.0,<1.0.0)",
    "timm (>=0.9.7)",
    "ftfy (>=6.1.1)",
    "decord",
    "einops",
    "opencv-python-headless",
    "type-extensions",
    "regex",
    "pycocotools",
    "psutil",
]


[project.urls]
repository = "https://github.com/Bryan1999V/lung-segmentation-tfm"
documentation = "https://github.com/Bryan1999V/lung-segmentation-tfm"


[tool.poetry]
requires-poetry = ">=2.0"
readme = ["README.md"]
packages = [
    { include = "nodule_classification" },
    { include = "nodule_segmentation" },
    { include = "utilities"},
    { include = "config" },
    { include = "metrics" },
]
version = "0.0.0"


[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "semver"
pattern = "(?P<base>\\d+\\.\\d+\\.[\\d\\a-zA-Z\\.\\-\\+]+)"


[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning"]
build-backend = "poetry_dynamic_versioning.backend"
